version: "3.7"

services:
  prymeira_account_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prymeira_account
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRYMEIRA_POSTGRES_PASSWORD}
    networks:
      prymeira_account_internal:
        aliases:
          - postgres
    volumes:
      - prymeira_account_postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure

  prymeira_account_api:
    image: ghcr.io/yohannreimer/prymeira-account-api:latest
    networks:
      prymeira_account_internal:
        aliases:
          - prymeira_account_api
          - account_api
    environment:
      DATABASE_URL: postgresql://postgres:${PRYMEIRA_POSTGRES_PASSWORD}@postgres:5432/prymeira_account
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_ACTION_TOKEN: ${ADMIN_ACTION_TOKEN}
      CORS_ORIGINS: https://hub.prymeiradigital.com.br,https://prymeiradigital.com.br,https://www.prymeiradigital.com.br,https://fluvia.prymeiradigital.com.br,https://velio.prymeiradigital.com.br,https://operis.prymeiradigital.com.br,https://flowcut.prymeiradigital.com.br,https://vincula.prymeiradigital.com.br,https://talk.prymeiradigital.com.br
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_TIME_WINDOW: ${RATE_LIMIT_TIME_WINDOW:-1 minute}
      PORT: 3001
      NODE_ENV: production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_START_MONTHLY: ${STRIPE_PRICE_START_MONTHLY}
      STRIPE_PRICE_START_ANNUAL: ${STRIPE_PRICE_START_ANNUAL}
      STRIPE_PRICE_EMPRESA_MONTHLY: ${STRIPE_PRICE_EMPRESA_MONTHLY}
      STRIPE_PRICE_EMPRESA_ANNUAL: ${STRIPE_PRICE_EMPRESA_ANNUAL}
      STRIPE_PRICE_EMPRESA_PRO_MONTHLY: ${STRIPE_PRICE_EMPRESA_PRO_MONTHLY}
      STRIPE_PRICE_EMPRESA_PRO_ANNUAL: ${STRIPE_PRICE_EMPRESA_PRO_ANNUAL}
      STRIPE_PRICE_SUITE_MONTHLY: ${STRIPE_PRICE_SUITE_MONTHLY}
      STRIPE_PRICE_SUITE_ANNUAL: ${STRIPE_PRICE_SUITE_ANNUAL}
      STRIPE_PRICE_OPERIS_MONTHLY: ${STRIPE_PRICE_OPERIS_MONTHLY}
      STRIPE_PRICE_OPERIS_ANNUAL: ${STRIPE_PRICE_OPERIS_ANNUAL}
      STRIPE_PRICE_MEDIA_MONTHLY: ${STRIPE_PRICE_MEDIA_MONTHLY}
      STRIPE_PRICE_MEDIA_ANNUAL: ${STRIPE_PRICE_MEDIA_ANNUAL}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure

  prymeira_hub_web:
    image: ghcr.io/yohannreimer/prymeira-hub-web:latest
    networks:
      - network_swarm_public
      - prymeira_account_internal
    environment:
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      VITE_PRYMEIRA_ACCOUNT_API_URL: /api
      VITE_PRODUCT_CRM_URL: https://vincula.prymeiradigital.com.br
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.prymeira-hub.rule=Host(`hub.prymeiradigital.com.br`)
        - traefik.http.routers.prymeira-hub.entrypoints=websecure
        - traefik.http.routers.prymeira-hub.tls=true
        - traefik.http.routers.prymeira-hub.tls.certresolver=letsencryptresolver
        - traefik.http.routers.prymeira-hub.service=prymeira-hub
        - traefik.http.services.prymeira-hub.loadbalancer.server.port=80
        - traefik.http.routers.prymeira-root.rule=Host(`prymeiradigital.com.br`)
        - traefik.http.routers.prymeira-root.entrypoints=websecure
        - traefik.http.routers.prymeira-root.tls=true
        - traefik.http.routers.prymeira-root.tls.certresolver=letsencryptresolver
        - traefik.http.routers.prymeira-root.service=prymeira-hub
        - traefik.http.routers.prymeira-www.rule=Host(`www.prymeiradigital.com.br`)
        - traefik.http.routers.prymeira-www.entrypoints=websecure
        - traefik.http.routers.prymeira-www.tls=true
        - traefik.http.routers.prymeira-www.tls.certresolver=letsencryptresolver
        - traefik.http.routers.prymeira-www.service=prymeira-hub

volumes:
  prymeira_account_postgres_data:
    external: true
    name: prymeira_account_postgres_data

networks:
  network_swarm_public:
    external: true
  prymeira_account_internal:
    driver: overlay
