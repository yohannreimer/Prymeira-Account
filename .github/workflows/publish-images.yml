name: Publish Prymeira Account Images

on:
  push:
    branches:
      - main
      - codex/account-api-auth-package
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: yohannreimer

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Account API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/account-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/prymeira-account-api:latest
            ghcr.io/${{ env.OWNER }}/prymeira-account-api:${{ github.sha }}

      - name: Build and push Hub Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hub-web/Dockerfile
          push: true
          build-args: |
            VITE_PRYMEIRA_ACCOUNT_API_URL=/api
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ env.OWNER }}/prymeira-hub-web:latest
            ghcr.io/${{ env.OWNER }}/prymeira-hub-web:${{ github.sha }}
